<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Monster Hunter Bingo — Board</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
<header class="topbar">
  <div class="container topbar__inner">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">MH</div>
      <div class="brand__text">
        <div class="brand__title">Monster Hunter Bingo</div>
        <div id="boardSubtitle" class="brand__subtitle">Board</div>
      </div>
    </div>

    <nav class="topbar__nav">
      <a class="link" href="index.html">Change Team</a>
      <a class="link" href="admin.html">Admin</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="card board-page-card">
    <div class="board-head">
      <div>
        <h1 id="boardTitle" class="m0">Team Board</h1>
        <div id="boardMeta" class="muted">Loading…</div>
      </div>

      <div class="board-actions">
        <button id="prevBoardBtn" class="btn" type="button">Prev</button>
        <button id="nextBoardBtn" class="btn" type="button">Next</button>
      </div>
    </div>

    <div class="board-stage-wrap">
      <div class="board-ornament board-ornament--outer" aria-hidden="true">
        <img class="board-ornament__corner board-ornament__corner--tl" src="/assets/cornerdeco.png" alt="">
        <img class="board-ornament__corner board-ornament__corner--tr" src="/assets/cornerdeco.png" alt="">
        <img class="board-ornament__corner board-ornament__corner--br" src="/assets/cornerdeco.png" alt="">
        <img class="board-ornament__corner board-ornament__corner--bl" src="/assets/cornerdeco.png" alt="">
      </div>

      <div id="boardStage" class="board-stage" aria-label="Bingo board">
        <div id="zoneBg" class="board-bg" aria-hidden="true"></div>
        <div class="board-frame" aria-hidden="true"></div>

        <div class="board-shell">
          <div class="board-grid-stack">
            <svg id="boardBingoOverlay" class="bingo-overlay" aria-hidden="true"></svg>
            <div id="boardGrid" class="board-grid" role="grid" aria-label="Board tiles"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="board-legend">
      <div class="legend">
        <span class="legend__dot legend__dot--stamped" aria-hidden="true"></span>
        <span class="muted">Stamped (good job!)</span>
      </div>
      <div class="legend">
        <span class="legend__dot legend__dot--unstamped" aria-hidden="true"></span>
        <span class="muted">Unstamped</span>
      </div>
      <div class="muted small">
        If anything looks wrong, contact the event organizer.
      </div>
    </div>
  </section>
</main>

<footer class="footer container">
  <div class="muted small">
    Live data is powered by Firebase Realtime Database.
  </div>
</footer>

<script type="module" src="js/firebase-init.js"></script>
<script src="js/app.js"></script>
</body>
</html>
