<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
<main class="container" style="max-width:520px; padding:48px 0;">
    <section class="card" style="padding:20px;">
        <h1 class="m0">Admin Login</h1>
        <p class="muted">Sign in to access admin pages.</p>

        <form id="adminLoginForm" class="stack-sm" style="margin-top:16px;">
            <input id="adminEmail" class="input" type="email" placeholder="Email" autocomplete="username" />
            <input id="adminPassword" class="input" type="password" placeholder="Password" autocomplete="current-password" />
            <div class="inline-actions">
                <button class="btn btn--primary" type="submit">Sign In</button>
                <a class="btn btn--small" href="index.html">Back</a>
            </div>
            <div id="adminLoginStatus" class="status"></div>
        </form>
    </section>
</main>

<script type="module" src="js/firebase-init.js"></script>
<script src="js/app.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
